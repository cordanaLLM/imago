version = 1

# Whole-tree default. REUSE 3.3 applies only the last annotation table that matches a
# file, so this table stays first and every override stays after it.
[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lusoris"
SPDX-License-Identifier = "EUPL-1.2"

# The vendored interfig engine keeps its upstream MIT terms. VENDOR.md and vendor.json sit
# outside upstream/ and stay EUPL-1.2.
[[annotations]]
path = ["tools/figures/third_party/interfig/upstream/**"]
precedence = "override"
SPDX-FileCopyrightText = "2025 Vectorize AI, Inc."
SPDX-License-Identifier = "MIT"

# The committed figure player bundles the loader and player code (EUPL-1.2) with interfig,
# React, react-dom and scheduler (MIT). dist/THIRD-PARTY-LICENSES.txt carries the full MIT
# texts.
[[annotations]]
path = ["tools/figures/dist/**"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Lusoris",
  "2025 Vectorize AI, Inc.",
  "Meta Platforms, Inc. and affiliates",
]
SPDX-License-Identifier = "EUPL-1.2 AND MIT"

# The register skills adapted from MIT-licensed upstreams carry that upstream's licence text
# as a LICENSE file beside each skill, copied byte for byte. The skill texts themselves are
# EUPL-1.2 with their own header.
[[annotations]]
path = [
  ".agents/skills/caveman/LICENSE",
  ".claude/skills/caveman/LICENSE",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julius Brussee"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  ".agents/skills/adhd-format/LICENSE",
  ".agents/skills/social-text/LICENSE",
  ".claude/skills/adhd-format/LICENSE",
  ".claude/skills/social-text/LICENSE",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Ayoub Ghriss"
SPDX-License-Identifier = "MIT"

# Copied byte for byte from build/ of cordanaLLM/Aegis-OS at commit
# e915c654e6c1e497c976c02ae977067516575552 (ADR-0030); the schema owner's notice applies.
[[annotations]]
path = [
  "pkg/kernel/testdata/aegis/kernel-requirement.json",
  "pkg/kernel/testdata/aegis/kernel-requirement.reference.json",
  "pkg/kernel/testdata/aegis/kernel-requirement.schema.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lusoris <lusoris@proton.me>"
SPDX-License-Identifier = "EUPL-1.2"
