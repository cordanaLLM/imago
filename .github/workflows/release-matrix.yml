name: release-matrix
on:
  schedule:
    - cron: "0 2 * * 0"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to build"
        required: true
        default: "base-generic"
        type: choice
        options:
          - base-generic
          - base-intel
          - base-amd
          - base-nvidia-legacy
          - base-nvidia-mainstream
          - base-nvidia-modern
          - base-nvidia-bleeding
          - base-nvidia-datacenter
          - docker-generic
          - docker-intel
          - docker-amd
          - docker-nvidia
          - docker-nvidia-modern
          - docker-nvidia-bleeding
          - podman-generic
          - k8s-node-generic
          - k8s-node-cilium
          - k8s-node-calico
          - k8s-node-flannel
          - k8s-node-intel
          - k8s-node-amd
          - k8s-node-nvidia
          - k8s-node-nvidia-modern
          - k8s-node-nvidia-bleeding
          - k3s-agent-generic
          - k3s-agent-intel
          - k3s-agent-amd
          - k3s-agent-nvidia
          - k3s-server-generic
          - cloudnative-generic
          - cloudnative-k8s
          - cloudnative-storage
          - cloudnative-pg
          - ai-infer-generic
          - ai-infer-intel
          - ai-infer-amd
          - ai-infer-nvidia
          - ai-infer-nvidia-modern
          - ai-infer-nvidia-bleeding
          - appliance-vision-nvr
          - appliance-gateway-dns
          - appliance-media-server
          - appliance-ci-runner
          - appliance-game-server


permissions:
  contents: read

env:
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-matrix:
    name: Build Image (${{ matrix.flavor }})
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - base-generic
          - docker-generic
          - k8s-node-generic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.11.2"
      - name: Install QEMU, ISO Authoring and Zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso zstd
      - name: Build Image with Packer
        # A GitHub-hosted runner has no nested virtualisation, so /dev/kvm does not
        # exist and QEMU refuses to start, reporting only "Qemu failed to start".
        # Emulation is slower but it is the only accelerator available here; a build
        # on real hardware keeps the kvm default.
        env:
          PKR_VAR_accelerator: tcg
          # output_directory is "${var.output_dir}/${var.flavor}", and -only selects a
          # build without setting the variable, so every flavor wrote into the default
          # directory and overwrote the previous one.
          PKR_VAR_flavor: ${{ matrix.flavor }}
        run: |
          cd packer
          packer init .
          packer build -only="${{ matrix.flavor }}.qemu.image" .
      - name: Compress Image with Zstandard
        # The build runs inside packer/, so the artifacts land there rather than at the
        # repository root where this step and the upload used to look for them.
        run: |
          cd "packer/output-images/${{ matrix.flavor }}"
          zstd -T0 -19 --rm ./*.qcow2
          sha256sum ./*.qcow2.zst > SHA256SUMS
      - name: Upload Release Artifacts
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            packer/output-images/${{ matrix.flavor }}/*.qcow2.zst
            packer/output-images/${{ matrix.flavor }}/SHA256SUMS
