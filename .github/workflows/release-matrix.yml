name: release-matrix
on:
  schedule:
    - cron: "0 2 * * 0"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to build"
        required: true
        default: "base-generic"
        type: choice
        options:
          - base-generic
          - base-intel
          - base-amd
          - base-nvidia-legacy
          - base-nvidia-mainstream
          - base-nvidia-modern
          - base-nvidia-bleeding
          - base-nvidia-datacenter
          - docker-generic
          - docker-intel
          - docker-amd
          - docker-nvidia
          - docker-nvidia-modern
          - docker-nvidia-bleeding
          - podman-generic
          - k8s-node-generic
          - k8s-node-cilium
          - k8s-node-calico
          - k8s-node-flannel
          - k8s-node-intel
          - k8s-node-amd
          - k8s-node-nvidia
          - k8s-node-nvidia-modern
          - k8s-node-nvidia-bleeding
          - k3s-agent-generic
          - k3s-agent-intel
          - k3s-agent-amd
          - k3s-agent-nvidia
          - k3s-server-generic
          - cloudnative-generic
          - cloudnative-k8s
          - cloudnative-storage
          - cloudnative-pg
          - ai-infer-generic
          - ai-infer-intel
          - ai-infer-amd
          - ai-infer-nvidia
          - ai-infer-nvidia-modern
          - ai-infer-nvidia-bleeding
          - appliance-vision-nvr
          - appliance-gateway-dns
          - appliance-media-server
          - appliance-ci-runner
          - appliance-game-server


permissions:
  contents: read

# A release run is never cancelled: the sign job must see every flavor of its release.
# A group holds one running and one pending run, and a new pending run cancels the
# older one. A manual run therefore gets a group per flavor: with one group per ref,
# five flavors dispatched on main cancelled each other, and the weekly schedule
# cancelled the last one. Schedule and release runs keep the shared group.
concurrency:
  group: release-matrix-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'generic' }}
  cancel-in-progress: false

jobs:
  # Build, cosign signature and provenance run in the called workflow release-build.yml, so
  # the signing certificate names that file, not this trigger workflow. A verifier can require
  # that identity; this is the reusable-workflow layout GitHub documents for SLSA v1 Build
  # Level 3 (ADR-0037). The callee's jobs get no more permission than this job grants.
  release:
    uses: ./.github/workflows/release-build.yml
    with:
      flavors: ${{ github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.flavor) || '["base-generic","docker-generic","k8s-node-generic"]' }}
    permissions:
      contents: write # grant to callee for uploading release assets
      id-token: write # grant to callee for keyless signing and provenance
      attestations: write # grant to callee for SLSA build provenance
