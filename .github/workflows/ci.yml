---
name: ci
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review starts the run a draft's stopped job did not make.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Praetor engine commit the local hooks and `make verify-all` run. Read by
  # .config/lefthook/engine.sh on the workstation; no job in this workflow uses it.
  PRAETOR_REF: 3bbde07342bdece12c46f74b0ee2c1f51129478f

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-26.04
    outputs:
      packer: ${{ steps.filter.outputs.packer }}
      shell: ${{ steps.filter.outputs.shell }}
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            packer:
              - 'packer/**'
              - 'versions.json'
            shell:
              - 'packer/provisioners/*.sh'
              - 'scripts/*.sh'
            go:
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'pkg/**'
            python:
              - 'tests/**'
              - '**/*.py'
              - 'pyproject.toml'
              - 'ruff.toml'
              - '.github/requirements/test.txt'
              - '.github/requirements/lint.txt'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'README.md'
              - 'FLAVORS.md'
              - 'CHANGELOG.md'
              - '.github/requirements/docs.txt'
            workflows:
              - '.github/workflows/**'
              - '.github/*.json'
              - '.yamllint.yml'
              - 'Makefile'
              - '.github/requirements/lint.txt'

  lint-packer:
    name: Packer Format & Validate
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.packer == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789  # v3.4.0
        with:
          version: "1.11.2"
      - name: Validate Packer
        run: |
          cd packer
          packer init .
          packer fmt -check .
          packer validate .

  lint-shell:
    name: ShellCheck & Shfmt Provisioners
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Shell Analyzers
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
      - name: Run ShellCheck
        run: shellcheck packer/provisioners/*.sh scripts/*.sh
      - name: Check Formatting (shfmt)
        run: shfmt -d -i 2 -ci packer/provisioners/*.sh scripts/*.sh

  lint-workflows:
    name: Actionlint & Yamllint
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # actionlint comes from a pinned release and must match the checksum written here,
      # not one fetched next to the archive: the install script on the main branch it used
      # to run could change between two runs of the same commit.
      - name: Install Workflow Linters
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yamllint
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --max-time 120 --retry 3 -o "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  /tmp/${archive}" | sha256sum -c -
          sudo tar -xzf "/tmp/${archive}" -C /usr/local/bin actionlint
      - name: Run Actionlint
        run: actionlint .github/workflows/*.yml
      - name: Run Yamllint
        run: yamllint -c .yamllint.yml .github/ packer/http/

  # codespell reads every tracked text file, so a change detector cannot tell which
  # changes it must see; it runs on every event.
  lint-spelling:
    name: Codespell
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Codespell
        run: pip install --require-hashes -r .github/requirements/lint.txt
      - name: Run Codespell
        run: codespell

  lint-python:
    name: Ruff Lint & Format
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.python == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: github.event.pull_request.draft != true
        with:
          python-version: "3.12"
      - name: Install Ruff
        if: github.event.pull_request.draft != true
        run: pip install --require-hashes -r .github/requirements/lint.txt
      # The same two commands as `make lint`, over every Python file of the repository.
      - name: Run Ruff Lint
        if: github.event.pull_request.draft != true
        run: ruff check .
      - name: Check Ruff Formatting
        if: github.event.pull_request.draft != true
        run: ruff format --check .

  test-go:
    name: Go 1.27 Build & Unit Tests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Run Go Vet
        run: go vet ./...
      - name: Run Go Unit Tests
        run: go test ./... -v
      - name: Compile imago
        run: go build -o bin/imago ./cmd/imago

  test-python:
    name: Pytest Verification Suite
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.packer == 'true' ||
      needs.changes.outputs.shell == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789  # v3.4.0
        with:
          version: "1.11.2"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          cd packer && packer init . && cd ..
          pip install --require-hashes -r .github/requirements/test.txt
          # tests/test_python_lint_gate.py runs ruff on the files ruff.toml exempts.
          pip install --require-hashes -r .github/requirements/lint.txt
      - name: Run Pytest Suite
        env:
          # A missing Docker daemon, bash or slow preparation step fails a live test
          # here instead of skipping it (tests/harness/live.py).
          IMAGO_REQUIRE_LIVE_TESTS: "1"
        run: pytest tests/ -v

  docs-strict:
    name: Strict MkDocs Build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install MkDocs Dependencies
        run: pip install --require-hashes -r .github/requirements/docs.txt
      - name: Build MkDocs Strict
        run: mkdocs build --strict

  gitleaks:
    name: Secret & Privacy Leak Scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action requires a paid license for organization-owned repositories;
      # the CLI does not. Pinned release, verified against the published checksums.
      - name: Run Gitleaks CLI against full history
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --max-time 120 --retry 3 -o "/tmp/${archive}" "${base}/${archive}"
          curl -sSfL --max-time 60 --retry 3 -o /tmp/gitleaks_checksums.txt \
            "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && grep " ${archive}$" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          python3 -I tools/ci/scanner_canary.py gitleaks --binary /tmp/gitleaks
          /tmp/gitleaks git --redact --no-banner --exit-code 1 .
