---
name: ci
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review starts the run a draft's stopped job did not make.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Praetor engine commit the local hooks and `make verify-all` run. Read by
  # .config/lefthook/engine.sh on the workstation; no job in this workflow uses it.
  PRAETOR_REF: 019b879ec69178570f53b97a113f67d62629e4c1

jobs:
  lint-packer:
    name: Packer Format & Validate
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the paths this job tests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: .github/path-filters.yml
      - name: Report that no tested path changed
        if: github.event_name == 'pull_request' && steps.filter.outputs.lint-packer != 'true'
        shell: bash
        run: echo "::notice title=Nothing to check::No path of filter lint-packer in .github/path-filters.yml changed."
      - name: Resolve Packer version pin
        id: packer-pin
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-packer == 'true'
        run: echo "version=$(jq -r .build.packer.version versions.json)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789  # v3.4.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-packer == 'true'
        with:
          version: ${{ steps.packer-pin.outputs.version }}
      - name: Validate Packer
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-packer == 'true'
        run: |
          cd packer
          packer init .
          packer fmt -check .
          packer validate .

  lint-shell:
    name: ShellCheck & Shfmt Provisioners
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the paths this job tests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: .github/path-filters.yml
      - name: Report that no tested path changed
        if: github.event_name == 'pull_request' && steps.filter.outputs.lint-shell != 'true'
        shell: bash
        run: echo "::notice title=Nothing to check::No path of filter lint-shell in .github/path-filters.yml changed."
      - name: Install Shell Analyzers
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-shell == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
      - name: Run ShellCheck
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-shell == 'true'
        run: shellcheck packer/provisioners/*.sh scripts/*.sh
      - name: Check Formatting (shfmt)
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-shell == 'true'
        run: shfmt -d -i 2 -ci packer/provisioners/*.sh scripts/*.sh

  lint-workflows:
    name: Actionlint & Yamllint
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the paths this job tests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: .github/path-filters.yml
      - name: Report that no tested path changed
        if: github.event_name == 'pull_request' && steps.filter.outputs.lint-workflows != 'true'
        shell: bash
        run: echo "::notice title=Nothing to check::No path of filter lint-workflows in .github/path-filters.yml changed."
      # actionlint comes from a pinned release and must match the checksum written here,
      # not one fetched next to the archive: the install script on the main branch it used
      # to run could change between two runs of the same commit.
      - name: Install Workflow Linters
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-workflows == 'true'
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yamllint
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --max-time 120 --retry 3 -o "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  /tmp/${archive}" | sha256sum -c -
          sudo tar -xzf "/tmp/${archive}" -C /usr/local/bin actionlint
      - name: Run Actionlint
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-workflows == 'true'
        run: actionlint .github/workflows/*.yml
      - name: Run Yamllint
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-workflows == 'true'
        run: yamllint -c .yamllint.yml .github/ packer/http/

  # codespell reads every tracked text file, so a path filter cannot tell which
  # changes it must see; it runs on every event.
  lint-spelling:
    name: Codespell
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Codespell
        run: pip install --require-hashes -r .github/requirements/lint.txt
      - name: Run Codespell
        run: codespell

  lint-python:
    name: Ruff Lint & Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the paths this job tests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: .github/path-filters.yml
      - name: Report that no tested path changed
        if: github.event_name == 'pull_request' && steps.filter.outputs.lint-python != 'true'
        shell: bash
        run: echo "::notice title=Nothing to check::No path of filter lint-python in .github/path-filters.yml changed."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-python == 'true'
        with:
          python-version: "3.12"
      - name: Install Ruff
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-python == 'true'
        run: pip install --require-hashes -r .github/requirements/lint.txt
      # The same two commands as `make lint`, over every Python file of the repository.
      - name: Run Ruff Lint
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-python == 'true'
        run: ruff check .
      - name: Check Ruff Formatting
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint-python == 'true'
        run: ruff format --check .

  test-go:
    name: Go Build & Unit Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the paths this job tests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: .github/path-filters.yml
      - name: Report that no tested path changed
        if: github.event_name == 'pull_request' && steps.filter.outputs.test-go != 'true'
        shell: bash
        run: echo "::notice title=Nothing to check::No path of filter test-go in .github/path-filters.yml changed."
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.test-go == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run Go Vet
        if: github.event_name != 'pull_request' || steps.filter.outputs.test-go == 'true'
        run: go vet ./...
      - name: Run Go Unit Tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.test-go == 'true'
        run: go test ./... -v
      - name: Compile imago
        if: github.event_name != 'pull_request' || steps.filter.outputs.test-go == 'true'
        run: go build -o bin/imago ./cmd/imago

  test-python:
    name: Pytest Verification Suite
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the paths this job tests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: .github/path-filters.yml
      - name: Report that no tested path changed
        if: github.event_name == 'pull_request' && steps.filter.outputs.test-python != 'true'
        shell: bash
        run: echo "::notice title=Nothing to check::No path of filter test-python in .github/path-filters.yml changed."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.test-python == 'true'
        with:
          python-version: "3.12"
      - name: Resolve Packer version pin
        id: packer-pin
        if: github.event_name != 'pull_request' || steps.filter.outputs.test-python == 'true'
        run: echo "version=$(jq -r .build.packer.version versions.json)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789  # v3.4.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.test-python == 'true'
        with:
          version: ${{ steps.packer-pin.outputs.version }}
      - name: Install Dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.test-python == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          cd packer && packer init . && cd ..
          pip install --require-hashes -r .github/requirements/test.txt
          # tests/test_python_lint_gate.py runs ruff on the files ruff.toml exempts.
          pip install --require-hashes -r .github/requirements/lint.txt
      - name: Measure the Docker daemon answer time
        # tests/test_container_integration.py bases its probe bounds on this value.
        if: github.event_name != 'pull_request' || steps.filter.outputs.test-python == 'true'
        run: |
          set -euo pipefail
          answered=0
          for attempt in 1 2 3 4 5; do
            start="$(date +%s.%N)"
            if timeout 60 docker info --format '{{.ServerVersion}}' > /dev/null; then
              code=0
            else
              code=$?
            fi
            seconds="$(awk -v s="${start}" -v e="$(date +%s.%N)" 'BEGIN { printf "%.3f", e - s }')"
            echo "attempt=${attempt} seconds=${seconds} exit=${code}" | tee -a "${GITHUB_STEP_SUMMARY}"
            if [ "${code}" -eq 0 ]; then
              answered=$((answered + 1))
            fi
          done
          if [ "${answered}" -eq 0 ]; then
            echo "::error::docker info failed in all 5 attempts"
            exit 1
          fi
      - name: Install container-structure-test
        if: github.event_name != 'pull_request' || steps.filter.outputs.test-python == 'true'
        run: |
          set -euo pipefail
          cst_version="$(jq -r .tools.container_structure_test versions.json)"
          base_url="https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${cst_version}"
          asset="container-structure-test-linux-amd64"
          tmp_dir="$(mktemp -d)"
          curl -sSfL --max-time 30 -o "${tmp_dir}/${asset}" "${base_url}/${asset}"
          curl -sSfL --max-time 30 -o "${tmp_dir}/checksums.txt" "${base_url}/checksums.txt"
          (cd "${tmp_dir}" && grep -E "[[:space:]]${asset}\$" checksums.txt | sha256sum -c -)
          sudo install -m 0755 "${tmp_dir}/${asset}" /usr/local/bin/container-structure-test
          rm -rf "${tmp_dir}"
      - name: Run Pytest Suite
        if: github.event_name != 'pull_request' || steps.filter.outputs.test-python == 'true'
        env:
          # A missing Docker daemon, bash or slow preparation step fails a live test
          # here instead of skipping it (tests/harness/live.py).
          IMAGO_REQUIRE_LIVE_TESTS: "1"
        run: pytest tests/ -v

  docs-strict:
    name: Strict MkDocs Build
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the paths this job tests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: .github/path-filters.yml
      - name: Report that no tested path changed
        if: github.event_name == 'pull_request' && steps.filter.outputs.docs-strict != 'true'
        shell: bash
        run: echo "::notice title=Nothing to check::No path of filter docs-strict in .github/path-filters.yml changed."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.docs-strict == 'true'
        with:
          python-version: "3.12"
      - name: Install MkDocs Dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.docs-strict == 'true'
        run: pip install --require-hashes -r .github/requirements/docs.txt
      - name: Build MkDocs Strict
        if: github.event_name != 'pull_request' || steps.filter.outputs.docs-strict == 'true'
        run: mkdocs build --strict

  gitleaks:
    name: Secret & Privacy Leak Scan
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # gitleaks-action requires a paid license for organization-owned repositories;
      # the CLI does not. Pinned release, verified against the published checksums.
      - name: Run Gitleaks CLI against full history
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --max-time 120 --retry 3 -o "/tmp/${archive}" "${base}/${archive}"
          curl -sSfL --max-time 60 --retry 3 -o /tmp/gitleaks_checksums.txt \
            "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && grep " ${archive}$" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          python3 -I tools/ci/scanner_canary.py gitleaks --binary /tmp/gitleaks
          /tmp/gitleaks git --redact --no-banner --exit-code 1 .
