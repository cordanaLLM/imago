name: security-scans
on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the run a draft's stopped job did not make.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "13 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the paths this job tests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml
      - name: Report that no tested path changed
        if: github.event_name == 'pull_request' && steps.filter.outputs.semgrep != 'true'
        shell: bash
        run: echo "::notice title=Nothing to check::No path of filter semgrep in .github/path-filters.yml changed."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.semgrep == 'true'
        with:
          python-version: "3.12"
      # --no-deps: the lock names every package, and semgrep pins mcp==1.29.0, which
      # sast-overrides.txt replaces with 1.30.0 (GHSA-84m7-p3x7-pcfv); pip would refuse it.
      - run: pip install --require-hashes --no-deps -r .github/requirements/sast.txt
        if: github.event_name != 'pull_request' || steps.filter.outputs.semgrep == 'true'
      # The canary scans a planted finding outside the checkout first, so a rule
      # set or flag that stops reporting turns the job red instead of green.
      - name: Check semgrep refuses a planted finding
        if: github.event_name != 'pull_request' || steps.filter.outputs.semgrep == 'true'
        run: python3 -I tools/ci/scanner_canary.py semgrep --binary semgrep
      - name: Run semgrep security rules
        if: github.event_name != 'pull_request' || steps.filter.outputs.semgrep == 'true'
        run: |
          semgrep --error --config p/ci --config p/security-audit .

  govulncheck:
    name: Govulncheck Reachable Go Vulnerabilities
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the paths this job tests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml
      - name: Report that no tested path changed
        if: github.event_name == 'pull_request' && steps.filter.outputs.govulncheck != 'true'
        shell: bash
        run: echo "::notice title=Nothing to check::No path of filter govulncheck in .github/path-filters.yml changed."
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.govulncheck == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
      # tools/govulncheck/go.mod pins the scanner. The text output exits 3 on a
      # reachable vulnerability and 1 when the scan cannot run (no database, a
      # package that does not load); -json, -format json, sarif or openvex exit 0
      # whatever they find (tests/test_security_scans.py).
      - name: Run govulncheck
        if: github.event_name != 'pull_request' || steps.filter.outputs.govulncheck == 'true'
        run: |
          set -euo pipefail
          go -C tools/govulncheck tool govulncheck -C "$PWD" ./...

  trivy:
    name: Trivy Filesystem CVE Scan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the paths this job tests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml
      - name: Report that no tested path changed
        if: github.event_name == 'pull_request' && steps.filter.outputs.trivy != 'true'
        shell: bash
        run: echo "::notice title=Nothing to check::No path of filter trivy in .github/path-filters.yml changed."
      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request' || steps.filter.outputs.trivy == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          # JSON for the coverage step below, which also prints every finding.
          format: "json"
          output: "trivy-results.json"
          # Names the pip lockfiles under .github/requirements/ for trivy.
          trivy-config: ".github/trivy.yaml"
          # trivy exits 0 on findings unless an exit code is given.
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      # A lockfile trivy does not recognise is neither scanned nor reported; the
      # job fails unless the report lists every tracked lockfile.
      - name: Check Trivy scanned every lockfile
        if: (!cancelled()) && (github.event_name != 'pull_request' || steps.filter.outputs.trivy == 'true')
        run: python3 -I tools/ci/trivy_coverage.py --report trivy-results.json

  gitleaks:
    name: Gitleaks History Scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # gitleaks-action requires a paid license for organization-owned repositories;
      # the CLI does not. Pinned release, verified against the published checksums.
      - name: Run Gitleaks CLI against full history
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --max-time 120 --retry 3 -o "/tmp/${archive}" "${base}/${archive}"
          curl -sSfL --max-time 60 --retry 3 -o /tmp/gitleaks_checksums.txt \
            "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && grep " ${archive}$" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          python3 -I tools/ci/scanner_canary.py gitleaks --binary /tmp/gitleaks
          /tmp/gitleaks git --redact --no-banner --exit-code 1 .
