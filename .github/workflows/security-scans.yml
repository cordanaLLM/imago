name: security-scans
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "13 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Security Scan Paths
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'packer/**'
              - 'tests/**'
              - 'versions.json'
              - 'Makefile'
              - 'pyproject.toml'
              - 'go.mod'
              - 'go.sum'
              - 'tools/**'
              - '.github/**'
            go:
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'pkg/**'
              - 'tools/govulncheck/**'
              - '.github/workflows/security-scans.yml'

  semgrep:
    name: Semgrep SAST
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r .github/requirements/sast.txt
      # The canary scans a planted finding outside the checkout first, so a rule
      # set or flag that stops reporting turns the job red instead of green.
      - name: Check semgrep refuses a planted finding
        run: python3 -I tools/ci/scanner_canary.py semgrep --binary semgrep
      - name: Run semgrep security rules
        run: |
          semgrep --error --config p/ci --config p/security-audit .

  govulncheck:
    name: Govulncheck Reachable Go Vulnerabilities
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'schedule' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      # tools/govulncheck/go.mod pins the scanner. The text output exits 3 on a
      # reachable vulnerability and 1 when the scan cannot run (no database, a
      # package that does not load); -json, -format json, sarif or openvex exit 0
      # whatever they find (tests/test_security_scans.py).
      - name: Run govulncheck
        run: |
          set -euo pipefail
          go -C tools/govulncheck tool govulncheck -C "$PWD" ./...

  trivy:
    name: Trivy Filesystem CVE Scan
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          # JSON for the coverage step below, which also prints every finding.
          format: "json"
          output: "trivy-results.json"
          # Names the pip lockfiles under .github/requirements/ for trivy.
          trivy-config: ".github/trivy.yaml"
          # trivy exits 0 on findings unless an exit code is given.
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      # A lockfile trivy does not recognise is neither scanned nor reported; the
      # job fails unless the report lists every tracked lockfile.
      - name: Check Trivy scanned every lockfile
        if: ${{ !cancelled() }}
        run: python3 -I tools/ci/trivy_coverage.py --report trivy-results.json

  gitleaks:
    name: Gitleaks History Scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # gitleaks-action requires a paid license for organization-owned repositories;
      # the CLI does not. Pinned release, verified against the published checksums.
      - name: Run Gitleaks CLI against full history
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --max-time 120 --retry 3 -o "/tmp/${archive}" "${base}/${archive}"
          curl -sSfL --max-time 60 --retry 3 -o /tmp/gitleaks_checksums.txt \
            "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && grep " ${archive}$" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          python3 -I tools/ci/scanner_canary.py gitleaks --binary /tmp/gitleaks
          /tmp/gitleaks git --redact --no-banner --exit-code 1 .
