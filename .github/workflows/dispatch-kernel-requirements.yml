---
name: dispatch-kernel-requirements
on:
  push:
    branches: [main]
    paths:
      - "versions.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-kernel-requirements
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Requirements to nucleus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Parse Kernel & Driver Requirements
        id: parse
        run: |
          python3 -c "
          import json
          with open('versions.json', 'r') as f:
              data = json.load(f)
          req = {
              'drivers': data.get('drivers', {}),
              'runtimes': data.get('runtimes', {}),
              'kubernetes': data.get('kubernetes', {}).get('version', '')
          }
          with open('/tmp/payload.json', 'w') as out:
              json.dump(req, out)
          "
          echo "has_payload=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch Event to nucleus
        if: env.KERNEL_FORGE_TOKEN != ''
        uses: peter-evans/repository-dispatch@26b39f2445243964d4c7385747e4b2144255d441 # v3.0.0
        env:
          KERNEL_FORGE_TOKEN: ${{ secrets.KERNEL_FORGE_TOKEN }}
        with:
          token: ${{ secrets.KERNEL_FORGE_TOKEN }}
          repository: cordanaLLM/nucleus
          event-type: kernel_requirements_updated
          client-payload: '{"source": "imago", "ref": "${{ github.sha }}"}'
