---
name: dispatch-kernel-requirements
on:
  push:
    branches: [main]
    paths:
      - "kernel/requirement.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-kernel-requirements
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Kernel Requirement to nucleus
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      # The requirement is the Aegis-shaped aegis.p01-nucleus.kernel-requirement.v1
      # document; an empty feature list or an unknown probe fails here, never upstream.
      - name: Validate Kernel Requirement
        run: go run ./cmd/imago kernel requirement validate kernel/requirement.json

      - name: Build Dispatch Payload
        id: payload
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os

          path = "kernel/requirement.json"
          raw = open(path, "rb").read()
          doc = json.loads(raw)
          versions = json.load(open("versions.json", encoding="utf-8"))
          payload = {
              "source": "imago",
              "schema": doc["schema"],
              "correlation_id": doc["correlation-id"],
              "requirement": {
                  "path": path,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "ref": os.environ["GITHUB_SHA"],
              },
          }
          print("repository=" + versions["kernel"]["provider"])
          print("payload=" + json.dumps(payload, separators=(",", ":")))
          PY

      # Without the token nothing reaches nucleus; the job fails instead of
      # passing with the dispatch skipped (tests/test_kernel_dispatch.py).
      - name: Require Dispatch Token
        env:
          KERNEL_FORGE_TOKEN: ${{ secrets.KERNEL_FORGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KERNEL_FORGE_TOKEN:-}" ]; then
            echo "::error::KERNEL_FORGE_TOKEN is not set; the kernel requirement was not dispatched to nucleus"
            exit 1
          fi

      - name: Dispatch Event to nucleus
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.KERNEL_FORGE_TOKEN }}
          repository: ${{ steps.payload.outputs.repository }}
          event-type: kernel_requirements_updated
          client-payload: ${{ steps.payload.outputs.payload }}
