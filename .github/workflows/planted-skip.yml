---
# Planted defect for the required-checks fix: a job that is always skipped and that no
# change detector decides. The aggregator must refuse it. Removed before merge.
name: planted-skip
"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  planted:
    name: Planted Skipped Check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - run: echo "never runs"
