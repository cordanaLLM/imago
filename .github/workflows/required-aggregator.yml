# Aggregating status check. It waits for every other check on the commit and fails if
# one failed. The rule set in .github/rulesets/main.json requires it by name, next to
# eight checks it also waits for.

name: required-aggregator
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required-checks:
    name: required-checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Wait for upstream workflows
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: required-checks
          allowed-conclusions: success,skipped
          wait-interval: 20
      - name: All required checks passed
        run: echo "ok"
