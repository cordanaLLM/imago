name: supply-chain
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: SLSA Provenance & Cosign Attestation
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Generate SBOM and Sign Releases
        run: |
          echo "Supply chain attestation setup ready for release artifacts"
