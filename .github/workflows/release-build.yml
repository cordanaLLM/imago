---
# Copyright 2026 Lusoris
name: release-build

on:
  workflow_call:
    inputs:
      flavors:
        description: "JSON list of flavor names to build"
        required: true
        type: string

permissions:
  contents: read

env:
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-matrix:
    name: Build Image (${{ matrix.flavor }})
    runs-on: ubuntu-26.04
    # The slowest measured build job took 152 min (base-nvidia-legacy, 2026-10-18), the slowest
    # successful one 115 min; without a bound a hung job runs until the 6 h platform default.
    timeout-minutes: 240
    permissions:
      contents: write # upload the image assets to the published release
      id-token: write # keyless provenance attestation via OIDC
      attestations: write # SLSA build provenance attestation
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.flavors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse an Unknown Flavor
        # Second barrier behind the choice list: a flavor that packer/builds.pkr.hcl does
        # not build fails here, before any package is installed.
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          if ! grep -F -q "name    = \"${FLAVOR}\"" packer/builds.pkr.hcl; then
            echo "::error::Unknown flavor: ${FLAVOR}"
            exit 1
          fi
      - name: Check Upstream Package Sources
        # A pinned key, release or apt suite the vendor does not publish fails here in
        # seconds, not in a provisioner about 20 minutes into the Packer build.
        run: python3 -I tools/ci/upstream_sources.py check
      - name: Resolve Packer version pin
        id: packer-pin
        run: echo "version=$(jq -r .build.packer.version versions.json)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ steps.packer-pin.outputs.version }}
      - name: Install QEMU, ISO Authoring and Zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso squashfs-tools zstd
      - name: Build Image with Packer
        # A GitHub-hosted runner has no nested virtualisation, so /dev/kvm does not
        # exist and QEMU refuses to start, reporting only "Qemu failed to start".
        # Emulation is slower but it is the only accelerator available here; a build
        # on real hardware keeps the kvm default.
        # The Makefile build target is the single build entry point (HISS-19).
        env:
          PKR_VAR_accelerator: tcg
          # output_directory is "${var.output_dir}/${var.flavor}", and -only selects a
          # build without setting the variable, so every flavor wrote into the default
          # directory and overwrote the previous one.
          PKR_VAR_flavor: ${{ matrix.flavor }}
          FLAVOR: ${{ matrix.flavor }}
        run: make build FLAVOR="${FLAVOR}"
      - name: Boot the Image Once
        # A build that finishes proves only that the provisioners ran. The image boots from
        # a throw-away overlay with a NoCloud seed and passes only when cloud-init writes
        # this run's nonce to the serial console. Emulated, the stock cloud image of the
        # same release reached that point in 95 s on a workstation; the deadline leaves
        # room for a slower runner.
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: python3 -I tools/ci/boot_smoke.py --image packer/output-images/"${FLAVOR}"/*.qcow2 --accel tcg --timeout 1500
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Generate SBOMs from the Image Root File System
        # Syft reads no qcow2 disk: pointed at the file it writes a valid, empty SBOM. The
        # image is attached read-only through qemu-nbd and its root file system mounted
        # read-only, Syft catalogues that tree, and the check refuses an SBOM that lists
        # fewer Debian packages than tools/ci/release_assets.py requires.
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          out="packer/output-images/${FLAVOR}"
          root="${RUNNER_TEMP}/image-root"
          python3 -I tools/ci/release_assets.py attach --image "${out}"/*.qcow2 --at "${root}"
          status=0
          syft scan "dir:${root}" --base-path "${root}" --source-name "imago-${FLAVOR}" -o "cyclonedx-json=${out}/sbom-${FLAVOR}.cdx.json" -o "spdx-json=${out}/sbom-${FLAVOR}.spdx.json" || status=$?
          python3 -I tools/ci/netboot_assets.py extract --flavor "${FLAVOR}" --root "${root}" --out "${out}" || status=$?
          python3 -I tools/ci/release_assets.py detach --at "${root}"
          test "${status}" -eq 0
          python3 -I tools/ci/release_assets.py check --cdx "${out}/sbom-${FLAVOR}.cdx.json" --spdx "${out}/sbom-${FLAVOR}.spdx.json"
      - name: Compress Image with Zstandard
        # The build runs inside packer/, so the artifacts land there rather than at the
        # repository root where this step and the upload used to look for them. Each flavor
        # writes its own checksum file; the sign job merges them into the one SHA256SUMS of
        # the release, so the uploads no longer overwrite each other's SHA256SUMS.
        # lusoris-install-to-disk writes its input to a disk unchanged, so the release also
        # ships the image as raw disk: handed the qcow2 container, the helper refuses it.
        # qemu-img writes the raw file sparse, and zstd packs the unused space to almost
        # nothing. The forge refuses a release asset of 2 GiB or more, so split lists every
        # asset whole in the checksum file and cuts each larger one into parts that the
        # upload list names instead; the sizes check then measures exactly what is uploaded.
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          cd "packer/output-images/${FLAVOR}"
          qcow2=(./*.qcow2)
          test "${#qcow2[@]}" -eq 1
          qemu-img convert -O raw "${qcow2[0]}" "${qcow2[0]%.qcow2}.raw"
          zstd -T0 -19 --rm ./*.qcow2 ./*.raw
          netboot=(./*-netboot.vmlinuz ./*-netboot.initrd ./*-root.squashfs ./*.ipxe)
          python3 -I "${GITHUB_WORKSPACE}/tools/ci/release_assets.py" split --sums "checksums-${FLAVOR}.sha256" \
            --list "upload-${FLAVOR}.txt" ./*.qcow2.zst ./*.raw.zst ./sbom-*.json "${netboot[@]}"
          mapfile -t upload < "upload-${FLAVOR}.txt"
          python3 -I "${GITHUB_WORKSPACE}/tools/ci/release_assets.py" sizes --summary "${GITHUB_STEP_SUMMARY}" "${upload[@]}"
      - name: Attest Build Provenance
        # Attests every asset of this flavor (whole assets and parts) in the job that built them.
        id: attest
        if: github.event_name == 'release'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: packer/output-images/${{ matrix.flavor }}/checksums-${{ matrix.flavor }}.sha256
      - name: Verify the Provenance
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          FLAVOR: ${{ matrix.flavor }}
        run: >-
          gh attestation verify "packer/output-images/${FLAVOR}/sbom-${FLAVOR}.cdx.json"
          --bundle "${BUNDLE}"
          --repo "${GITHUB_REPOSITORY}"
          --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-build.yml"
      - name: Keep the Checksums and SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums-${{ matrix.flavor }}
          path: |
            packer/output-images/${{ matrix.flavor }}/checksums-${{ matrix.flavor }}.sha256
            packer/output-images/${{ matrix.flavor }}/sbom-*.json
            packer/output-images/${{ matrix.flavor }}/*-netboot.vmlinuz
            packer/output-images/${{ matrix.flavor }}/*-netboot.initrd
            packer/output-images/${{ matrix.flavor }}/*-root.squashfs
            packer/output-images/${{ matrix.flavor }}/*.ipxe
          if-no-files-found: error
      - name: Keep the Raw Image of a Manual Run
        # A manual run publishes nothing. Its raw image stays one day, so it can be checked
        # against the kept checksums and written to a loop device before a release ships it.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-${{ matrix.flavor }}
          path: packer/output-images/${{ matrix.flavor }}/*.raw.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Netboot Smoke Test
        # A manual run boots the extracted netboot assets over iPXE in diskless QEMU.
        # The positive run verifies NoCloud seed fetching and reaching the multi-user marker.
        # The negative run verifies that a corrupt digest halts with imago-netroot mismatch error.
        if: github.event_name == 'workflow_dispatch'
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          out="packer/output-images/${FLAVOR}"
          python3 -I tools/ci/netboot_smoke.py --assets "${out}" --flavor "${FLAVOR}" --accel tcg --timeout 1500
          python3 -I tools/ci/netboot_smoke.py --assets "${out}" --flavor "${FLAVOR}" --accel tcg --timeout 1500 --expect-mismatch
      - name: Upload Release Artifacts
        if: github.event_name == 'release'
        # --clobber replaces an asset of the same name, so a re-run of a failed flavor
        # uploads again instead of failing on the asset the first attempt left.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          FLAVOR: ${{ matrix.flavor }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cd "packer/output-images/${FLAVOR}"
          cp "${BUNDLE}" "provenance-${FLAVOR}.sigstore.json"
          mapfile -t upload < "upload-${FLAVOR}.txt"
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${upload[@]}" "provenance-${FLAVOR}.sigstore.json"

  sign:
    # Runs only when every flavor built, so the signed SHA256SUMS covers the whole release.
    # Keyless signing writes a public transparency-log entry, so it runs on a published
    # release only, never on the schedule or a manual run.
    name: Sign the Release Checksums
    needs: build-matrix
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write # upload SHA256SUMS and its bundle to the release
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checksums-*
          path: checksums
          merge-multiple: true
      - name: Merge the Flavor Checksums
        run: python3 -I tools/ci/release_assets.py merge --out SHA256SUMS checksums/checksums-*.sha256
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle SHA256SUMS.bundle SHA256SUMS
      - name: Verify the Signature
        # The identity is this reusable workflow at the release tag, as a downloader checks it.
        run: >-
          cosign verify-blob --bundle SHA256SUMS.bundle
          --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-build.yml@${GITHUB_REF}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          SHA256SUMS
      - name: Upload the Signed Checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber SHA256SUMS SHA256SUMS.bundle
