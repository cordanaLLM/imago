version: 1
# cordanaLLM/imago canonical configuration manifest (praetor governance).
# Target identity per the Aegis-OS connected stack contract; the GitHub
# transfer from lusoris/lusoris-cloud-images is tracked in planning/plan.json.
repository:
    owner: cordanaLLM
    name: imago
    visibility: public
    # Description, homepage and topics repeat what the forge carries today, so a remote sync
    # writes none of them. Public metadata changes with the first release under the new names.
    description: "Production-grade, hardened, hardware-accelerated cloud and bare-metal OS image forge on Ubuntu 26.04."
    homepage: "https://cordanallm.github.io/imago/"
    topics:
      - bare-metal
      - cdi
      - cloud-images
      - containerd
      - cuda
      - hardened
      - intel-arc
      - kubernetes
      - openvino
      - packer
      - proxmox
      - qemu
      - rocm
      - ubuntu-26-04
      - unraid
      - vllm
# Ed25519 Exit-0 receipt trust anchor (praetorctl gate keygen; private key
# outside the repository at ~/.config/praetor/receipt.key or PRAETOR_RECEIPT_KEY).
# This is the key cordanaLLM/praetor pins, held on the signing workstation; restored
# on 2026-10-11. It replaces b0131beef691..., which was generated on the office
# workstation on 2026-09-15 while this key was not available there.
receipt:
    public_key: "213f9534a662075308e2087694985eff7590386760a19609b08437412b46e9d8"
# Agent clients and editors in use. The engine compiles, generates and verifies files for
# these ids only; files of every other id are not tracked here.
agent_clients: [claude, codex, gemini]
editors: [universal, vscode, antigravity]
profiles:
    - os-image
facets:
    - security:high
    - agent:sandboxed
    - docs:seo-portal
# Strictness only increases: the 60-line function bound matches docs/principles.md.
overrides:
    complexity:
        max_cyclomatic: 10
        max_cognitive: 10
        max_func_loc: 60
        max_statements: 30
    branch_protection:
        enforce_linear_history: true
        require_signed_commits: true
        required_approving_reviewers: 1
        # Single maintainer today, as cordanaLLM/praetor and golusoris declare;
        # restore independent review once a second maintainer or bot can approve.
        review_mode: single_maintainer
        dismiss_stale_reviews: true
        # Declared at its live value; the forge default is the stricter one.
        require_extra_approval_for_unattributed_changes: true
    supply_chain:
        slsa_level: 3
        enforce_cosign: true
        require_sbom: true
    # release-please opens the release pull request with GITHUB_TOKEN (issue #45); the online
    # audit fails when the forge withdraws the capability, before a release run can.
    actions:
        default_workflow_permissions: read
        allow_create_and_approve_pull_requests: true
    ci:
        diff_aware_filtering: true
        skip_heavy_gates_on_docs_or_state: true
# Framework capability demand declared towards golusoris (see .needs.yaml).
needs:
    required:
        - clikit.cli
        - mcp.server
        - telemetry.logging
        - time.clock
    optional:
        - config.yaml
        - crypto.receipt
# Declared gaps (one rule, one path, a reason, an expiry). The audit prints each entry and
# fails once it expires.
exceptions:
    - rule: codespell
      path: tools/figures/player/player.js
      category: C
      reason: minified third-party interfig bundle
      entered: "2026-10-18"
      expires: "2026-10-28"
    - rule: codespell
      path: tools/figures/player/loader.js
      category: C
      reason: minified third-party interfig bundle
      entered: "2026-10-18"
      expires: "2026-10-28"
register:
    sources:
        expected: 13
        sha256:
            sha256:a72d30c2f78f31cb7e8af346bf13fea115e8730d75a1222a4314133134cd0fc1
        inputs:
            - path: .paperclip/harness.json
              surface: prompts
              kind: message
              format: json
              selector: operating_contract.*
            - path: .paperclip/harness.json
              surface: prompts
              kind: message
              format: json
              selector: invariants.*
