# ACCEPTED UPSTREAM. Praetor ships this archetype as of praetor#54, and this
# repository now declares it: see .standards.yaml and the vendored catalog entry
# at .config/archetypes/os-image.yaml, which is authoritative.
#
# This file is retained as the recorded output of step-archetype-draft, not as a
# live definition. Praetor widened the name and description to cover kernel and
# UKI forges as well as image forges, so that cordanaLLM/nucleus shares the
# profile; every other field was adopted from this draft unchanged.
#
# Schema: praetor profile definition (docs/guides/archetype-authoring.md).
# Complexity bounds follow the Holzmann Power of 10 adaptation this repository
# already enforces on shell provisioners and Python tests (60 lines per function).
id: "os-image"
name: "OS Image Forge"
description: "Hardened, reproducible OS image pipelines (Packer/QEMU, mkosi, UKI) with declarative version manifests, shell provisioners under Power-of-10 bounds, and signed image artifacts"
runtime: "image"

complexity:
  max_cyclomatic: 10
  max_cognitive: 12
  max_func_loc: 60
  max_statements: 40

branch_protection:
  enforce_linear_history: true
  require_signed_commits: true
  required_approving_reviewers: 1
  dismiss_stale_reviews: true

supply_chain:
  slsa_level: 3
  enforce_cosign: true
  require_sbom: true

linters:
  - "packer"
  - "shellcheck"
  - "shfmt"
  - "yamllint"
  - "trivy"
  - "gitleaks"
  - "codespell"

devcontainer_features:
  - "ghcr.io/devcontainers/features/common-utils:2"
  - "ghcr.io/devcontainers/features/go:1"
  - "ghcr.io/devcontainers/features/python:1"
